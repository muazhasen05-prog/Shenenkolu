<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Shenen Kolu Woreda Prosperity Party</title>
  <style>
    :root {
      --primary: #047857;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1329;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 480px;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid rgba(100, 116, 139, 0.2);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border-radius: 9999px;
      background-color: rgba(4, 120, 87, 0.15);
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .languages {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(100, 116, 139, 0.2);
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>Please check your network connection. You can continue reading cached woreda news and announcements once connection resumes.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>

    <div class="languages">
      <p><strong>Afaan Oromoo:</strong> Toora intarneetii irraa ala jirtu. Maaloo qunnamtii keessan mirkaneessaa.</p>
      <p><strong>አማርኛ:</strong> ከበይነመረብ ውጭ ነዎት። እባክዎ የበይነመረብ ግንኙነትዎን ያረጋግጡ።</p>
    </div>
  </div>
</body>
</html>
